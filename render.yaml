databases:
  - name: ondetem-db
    databaseName: ondetem
    user: ondetem
    plan: free

services:
  - type: web
    name: ondetem-manaus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ondetem.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ondetem-db
          property: connectionString
      - key: ONDETEM_HTTPS
        value: "1"
      - key: ONDETEM_READONLY
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.7"
