[project]
name = "ondetem"
version = "3.0.0"
description = "Plataforma mobile-first em FastAPI + PostgreSQL conectando moradores de Manaus a profissionais autônomos."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
